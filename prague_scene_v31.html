<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prague 1 renderer v31</title><link rel="icon" href="data:,"><link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/dark/main.css">
<style>*{box-sizing:border-box}html,body,#viewDiv{width:100%;height:100%;min-width:320px;min-height:240px;margin:0;overflow:hidden;background:#07101a}#viewDiv{position:fixed;inset:0}#status{position:fixed;left:12px;top:12px;z-index:20;max-width:min(520px,calc(100% - 24px));padding:8px 11px;border:1px solid rgba(32,227,255,.45);border-radius:7px;background:rgba(5,8,14,.86);color:#ffd23f;font:700 12px/1.4 "Segoe UI",system-ui,sans-serif;pointer-events:none}#status.ready{color:#3bff8b;border-color:rgba(59,255,139,.45)}#status.error{color:#ff6b6b;border-color:rgba(255,107,107,.55)}</style><script src="https://js.arcgis.com/4.34/"></script></head>
<body><div id="viewDiv" aria-label="Official IPR Prague 3D buildings"></div><div id="status">PRAGUE · preparing streamlined renderer…</div>
<script>(()=>{'use strict';
const statusEl=document.getElementById('status'),WEBSCENE_ID='7e6316e95cfe4f36ae06bbfb687bf34b',FALLBACK_ID='38d0af3a71564c2b9deba087a5af0f11',ORIGIN={lon:14.42076,lat:50.08745};
let view=null,layer=null,layerView=null,lastCamera=null,started=false,visible=true,probeBusy=false,pendingProbe=null;
const send=(type,data={})=>parent.postMessage({type,...data},'*');
function status(text,kind='loading'){statusEl.textContent=text;statusEl.className=kind==='ready'?'ready':kind==='error'?'error':'';send('prague-status',{text,color:kind==='ready'?'#3bff8b':kind==='error'?'#ff6b6b':'#ffd23f'});}
function timeout(ms,label){return new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms));}
async function proxyJson(url){const response=await Promise.race([fetch('/arcgis-proxy?url='+encodeURIComponent(url),{cache:'no-store'}),timeout(30000,'Portal request timed out')]);if(!response.ok)throw new Error('HTTP '+response.status+' while loading '+url);const data=await response.json();if(data&&data.error)throw new Error(data.error.message||'ArcGIS portal error');return data;}
function flatten(layers,out=[]){for(const item of layers||[]){if(!item)continue;out.push(item);if(Array.isArray(item.layers))flatten(item.layers,out);}return out;}
async function resolveLayer(){status('PRAGUE · resolving official IPR buildings…');try{const data=await proxyJson('https://www.arcgis.com/sharing/rest/content/items/'+WEBSCENE_ID+'/data?f=json');const candidates=flatten(data.operationalLayers||[]).map(item=>{const title=String(item.title||item.name||''),type=String(item.layerType||item.type||''),url=String(item.url||'');let score=0;if(/budov|building/i.test(title))score+=120;if(/scene/i.test(type))score+=55;if(/SceneServer/i.test(url))score+=70;if(item.itemId)score+=15;return {item,score};}).sort((a,b)=>b.score-a.score);const match=candidates.find(c=>c.score>=70)?.item;if(match){let url=String(match.url||'').replace(/^http:/i,'https:');const itemId=match.itemId||match.portalItem?.id||'';if(!url&&itemId){const meta=await proxyJson('https://www.arcgis.com/sharing/rest/content/items/'+itemId+'?f=json');url=String(meta.url||'').replace(/^http:/i,'https:');}if(url||itemId)return {url,itemId,title:match.title||'Budovy 3D',source:'current WebScene'};}}catch(error){console.warn('Current Prague WebScene resolution failed; trying fallback.',error);}const meta=await proxyJson('https://www.arcgis.com/sharing/rest/content/items/'+FALLBACK_ID+'?f=json');return {url:String(meta.url||'').replace(/^http:/i,'https:'),itemId:FALLBACK_ID,title:meta.title||'Budovy 3D',source:'fallback SceneLayer'};}
function applyCamera(camera){if(!camera)return;lastCamera=camera;if(!view||!visible)return;const z=Number.isFinite(camera.z)?camera.z:205;try{const next=view.camera.clone();next.position={longitude:camera.longitude,latitude:camera.latitude,z,spatialReference:{wkid:4326}};next.heading=Number.isFinite(camera.heading)?camera.heading:0;next.tilt=Number.isFinite(camera.tilt)?camera.tilt:78;next.fov=Number.isFinite(camera.fov)?camera.fov:64;view.camera=next;}catch(error){console.debug('Camera update skipped',error?.message||error);}}
async function runProbe(probe){if(!probe||!layerView||probeBusy)return;probeBusy=true;try{const p=probe.player||{},point={type:'point',longitude:p.longitude,latitude:p.latitude,z:p.z||195,spatialReference:{wkid:4326}};const q=layerView.createQuery();q.geometry=point;q.distance=1.7;q.units='meters';q.spatialRelationship='intersects';q.returnGeometry=false;let ids=[];try{ids=await layerView.queryObjectIds(q);}catch(error){console.debug('Prague collision query skipped',error?.message||error);}send('prague-collision-state',{seq:probe.seq,blocked:!!(ids&&ids.length),player:p});}finally{probeBusy=false;if(pendingProbe){const next=pendingProbe;pendingProbe=null;runProbe(next);}}}
async function boot(){if(started)return;started=true;try{const rect=document.getElementById('viewDiv').getBoundingClientRect();if(rect.width<2||rect.height<2)throw new Error('Prague iframe did not receive a visible viewport');const health=await Promise.race([fetch('/proxy-health',{cache:'no-store'}),timeout(5000,'Local proxy did not answer')]);if(!health.ok)throw new Error('Local proxy health check failed');if(typeof window.require!=='function')throw new Error('ArcGIS SDK did not load');window.require(['esri/config','esri/core/urlUtils','esri/core/reactiveUtils','esri/Map','esri/views/SceneView','esri/layers/SceneLayer'],async(esriConfig,urlUtils,reactiveUtils,Map,SceneView,SceneLayer)=>{try{esriConfig.request.timeout=120000;esriConfig.request.useIdentity=false;esriConfig.request.proxyUrl='/arcgis-proxy';for(const prefix of ['https://gp.iprpraha.cz','http://gp.iprpraha.cz','https://gs-pub.praha.eu','https://iprpraha.maps.arcgis.com'])try{urlUtils.addProxyRule({urlPrefix:prefix,proxyUrl:'/arcgis-proxy'});}catch(_e){}const source=await resolveLayer();if(!source.url&&!source.itemId)throw new Error('Official WebScene did not expose a building SceneLayer');if(source.url)try{urlUtils.addProxyRule({urlPrefix:new URL(source.url).origin,proxyUrl:'/arcgis-proxy'});}catch(_e){}status('PRAGUE · loading '+source.title+'…');layer=source.url?new SceneLayer({url:source.url,title:'Official IPR Prague 3D buildings'}):new SceneLayer({portalItem:{id:source.itemId},title:'Official IPR Prague 3D buildings'});const map=new Map({basemap:'dark-gray-vector',ground:'world-elevation',layers:[layer]});view=new SceneView({container:'viewDiv',map,qualityProfile:'low',viewingMode:'global',ui:{components:[]},camera:{position:{longitude:ORIGIN.lon-0.012,latitude:ORIGIN.lat-0.010,z:850},heading:25,tilt:66},constraints:{altitude:{min:1,max:5000}},environment:{background:{type:'color',color:'#07101a'},atmosphereEnabled:true,starsEnabled:false,lighting:{directShadowsEnabled:false,ambientOcclusionEnabled:false}}});reactiveUtils.watch(()=>view.fatalError,error=>{if(error){console.error('Prague SceneView fatal error',error);send('prague-error',{error:'ArcGIS fatal renderer error: '+(error.message||error)});}});await Promise.race([Promise.all([view.when(),layer.load()]),timeout(120000,'Official Prague SceneLayer timed out')]);if(lastCamera)applyCamera(lastCamera);status('PRAGUE 1 · buildings connected; tiles are streaming…');send('prague-ready');layerView=await view.whenLayerView(layer);reactiveUtils.whenOnce(()=>!layerView.updating&&!view.updating).then(()=>status('PRAGUE 1 · OFFICIAL IPR BUILDINGS · READY','ready')).catch(()=>{});}catch(error){console.error(error);status('Prague failed: '+(error.message||error),'error');send('prague-error',{error:error.message||String(error)});}},error=>{status('ArcGIS modules failed: '+(error.message||error),'error');send('prague-error',{error:error.message||String(error)});});}catch(error){console.error(error);status('Prague failed: '+(error.message||error),'error');send('prague-error',{error:error.message||String(error)});}}
addEventListener('message',event=>{const data=event.data;if(!data||typeof data!=='object')return;if(data.type==='prague-camera')applyCamera(data.camera);else if(data.type==='prague-probe'){if(probeBusy)pendingProbe=data;else runProbe(data);}else if(data.type==='prague-visible'){visible=!!data.visible;if(view&&visible){if(view.container!=='viewDiv')view.container='viewDiv';requestAnimationFrame(()=>lastCamera&&applyCamera(lastCamera));}}else if(data.type==='prague-reload')location.reload();});
addEventListener('error',event=>send('prague-error',{error:event.message||'Unknown iframe error'}));addEventListener('unhandledrejection',event=>{const message=String(event.reason?.message||event.reason||'');if(/message channel closed|asynchronous response/i.test(message))return;console.error('Unhandled Prague rejection',event.reason);send('prague-error',{error:message||'Unhandled Prague renderer rejection'});});requestAnimationFrame(()=>requestAnimationFrame(boot));})();</script></body></html>
